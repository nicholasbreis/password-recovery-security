{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<div class="card">
  <h1>Entrar no sistema</h1>
  <p class="subtitle">Informe suas credenciais de acesso</p>

  <form method="POST" action="/login">
    <div class="form-group">
      <label for="email"
        >E-mail
        <span style="color: #64748b; font-size: 11px">(RF01)</span></label
      >
      <input
        type="email"
        id="email"
        name="email"
        required
        autofocus
        placeholder="seu@email.com"
      />
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        name="senha"
        required
        placeholder="••••••••"
      />
    </div>
    <p class="hint">Bloqueio automático após 3 tentativas inválidas (RF03)</p>
    <br />
    <button type="submit" class="btn btn-primary">Entrar</button>
    <a href="/recovery/" class="btn btn-secondary">Esqueci minha senha</a>
  </form>

  <hr class="divider" />
  <p class="text-center">
    <a href="/register" class="link">Não tem conta? Cadastrar</a>
  </p>
</div>
{% endblock %}
