{% extends "base.html" %} {% block title %}Novo usuário{% endblock %} {% block
content %}
<div class="card">
  <h1>Novo usuário</h1>
  <p class="subtitle">Criar conta manualmente (RF04)</p>

  <form method="POST" action="/admin/usuarios/novo">
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" name="nome" required placeholder="João Silva" />
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" name="email" required placeholder="joao@email.com" />
    </div>
    <div class="form-group">
      <label>Perfil</label>
      <select name="perfil">
        <option value="usuario">Usuário</option>
        <option value="admin">Administrador</option>
        <option value="analista">Analista</option>
      </select>
    </div>
    <div class="form-group">
      <label>Senha inicial</label>
      <input
        type="password"
        name="senha"
        required
        placeholder="Mínimo 8 caracteres"
      />
    </div>
    <button type="submit" class="btn btn-primary">Criar usuário</button>
    <a href="/admin/usuarios" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
