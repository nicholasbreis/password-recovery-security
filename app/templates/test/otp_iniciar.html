{% extends "base.html" %} {% block title %}Recuperação — OTP Isolado{% endblock
%} {% block content %}
<div class="card">
  <div
    style="
      background: #f1f5f9;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    "
  >
    Fluxo 2 — OTP isolado (modo de teste)
  </div>
  <h1>Recuperar senha</h1>
  <p class="subtitle">Informe seu e-mail para receber o código OTP</p>

  <form method="POST" action="/test/otp">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autofocus
        placeholder="seu@email.com"
      />
    </div>
    <p class="hint">
      Um código de 6 dígitos válido por 10 minutos será enviado
    </p>
    <br />
    <button type="submit" class="btn btn-primary">Enviar código</button>
    <a href="/test/" class="btn btn-secondary">Voltar ao painel</a>
  </form>
</div>
{% endblock %}
