{% extends "base.html" %} {% block title %}Nova senha — Fluxo Link{% endblock %}
{% block content %}
<div class="card">
  <div
    style="
      background: #f1f5f9;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    "
  >
    Fluxo 1 — Link por e-mail isolado (modo de teste)
  </div>
  <span class="icon-ok">🔓</span>
  <h1>Criar nova senha</h1>
  <p class="subtitle">Link válido por 30 minutos · uso único</p>

  <form method="POST" action="/test/link/reset">
    <input type="hidden" name="token" value="{{ token }}" />
    <div class="form-group">
      <label>Nova senha</label>
      <input
        type="password"
        name="nova_senha"
        required
        placeholder="Mínimo 8 caracteres"
      />
    </div>
    <div class="form-group">
      <label>Confirmar senha</label>
      <input
        type="password"
        name="confirmar_senha"
        required
        placeholder="Repita a senha"
      />
    </div>
    <button type="submit" class="btn btn-primary">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
