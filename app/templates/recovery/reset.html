{% extends "base.html" %} {% block title %}Nova senha{% endblock %} {% block
content %}
<div class="card">
  <span class="icon-ok">🔓</span>
  <h1>Criar nova senha</h1>
  <p class="subtitle">
    Defina sua nova senha. Link expira em 5 minutos e é de uso único (RF10).
  </p>

  <form method="POST" action="/recovery/reset">
    <input type="hidden" name="token" value="{{ token }}" />
    <div class="form-group">
      <label for="nova_senha">Nova senha</label>
      <input
        type="password"
        id="nova_senha"
        name="nova_senha"
        required
        placeholder="Mínimo 8 caracteres"
        oninput="checkStrength(this.value)"
      />
      <div
        id="strength-bar"
        style="
          height: 4px;
          border-radius: 2px;
          background: #e2e8f0;
          margin-top: 6px;
          overflow: hidden;
        "
      >
        <div
          id="strength-fill"
          style="
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition:
              width 0.3s,
              background 0.3s;
          "
        ></div>
      </div>
      <p
        id="strength-label"
        style="font-size: 11px; color: #64748b; margin-top: 4px"
      ></p>
    </div>
    <div class="form-group">
      <label for="confirmar_senha">Confirmar nova senha</label>
      <input
        type="password"
        id="confirmar_senha"
        name="confirmar_senha"
        required
        placeholder="Repita a senha"
      />
    </div>
    <p class="hint">Requisitos configuráveis pelo admin (RF23)</p>
    <br />
    <button type="submit" class="btn btn-primary">Salvar nova senha</button>
  </form>
</div>
{% endblock %} {% block scripts %}
<script>
  function checkStrength(v) {
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const colors = ["#ef4444", "#f59e0b", "#22c55e", "#16a34a"];
    const labels = ["Fraca", "Média", "Forte", "Muito forte"];
    const fill = document.getElementById("strength-fill");
    const lbl = document.getElementById("strength-label");
    fill.style.width = score * 25 + "%";
    fill.style.background = colors[score - 1] || "#e2e8f0";
    lbl.textContent = score > 0 ? labels[score - 1] : "";
  }
</script>
{% endblock %}
