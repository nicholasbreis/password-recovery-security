{% extends "base.html" %} {% block title %}Recuperar senha{% endblock %} {%
block content %}
<div class="card">
  <div class="progress-wrap">
    <p class="progress-label">Etapa 0 de 2 — Informar e-mail</p>
    <div class="progress-bar">
      <div class="prog-step active"></div>
      <div class="prog-step"></div>
    </div>
  </div>

  <h1>Recuperar senha</h1>
  <p class="subtitle">
    Informe o e-mail cadastrado para receber o código de verificação
  </p>

  <form method="POST" action="/recovery/">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autofocus
        placeholder="seu@email.com"
      />
    </div>
    <p class="hint">Sistema valida se o e-mail existe antes de enviar o OTP</p>
    <br />
    <button type="submit" class="btn btn-primary">Enviar código</button>
    <a href="/login" class="btn btn-secondary">Voltar ao login</a>
  </form>
</div>
{% endblock %}
