version: "3.9"

services:
  web:
    build: .
    container_name: recuperacao_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/recuperacao_db
      - MAIL_SERVER=mail
      - MAIL_PORT=1025
      - SECRET_KEY=dev-secret-key-troque-em-producao
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=5000

  db:
    image: mysql:8.0
    container_name: recuperacao_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recuperacao_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  mail:
    image: mailhog/mailhog
    container_name: recuperacao_mail
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  db_data:
